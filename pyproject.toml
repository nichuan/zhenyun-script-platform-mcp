[project]
name = "zhenyun-script-platform-mcp"
version = "0.1.0"
description = "MCP server for safe development and deployment on the Zhenyun Script Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.29,<2",
    "playwright>=1.50,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
zhenyun-script-platform-mcp = "zhenyun_script_platform_mcp.server:main"
zhenyun-script-platform-auth = "zhenyun_script_platform_mcp.auth_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhenyun_script_platform_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
